[build]
  command   = "npm run build"
  publish   = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  port    = 4321

# Redirigir /api/* a las funciones de Netlify
[[redirects]]
  from   = "/api/destinos"
  to     = "/.netlify/functions/destinos"
  status = 200

[[redirects]]
  from   = "/api/usuarios"
  to     = "/.netlify/functions/usuarios"
  status = 200

[[redirects]]
  from   = "/api/interacciones"
  to     = "/.netlify/functions/interacciones"
  status = 200

# Variables de entorno requeridas (se definen en Netlify dashboard)
# DATABASE_URL           — URL pooled de Neon (producción)
# DATABASE_URL_UNPOOLED  — URL directa de Neon (solo migraciones)

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@neondatabase/serverless"]

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Methods = "GET, POST, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
